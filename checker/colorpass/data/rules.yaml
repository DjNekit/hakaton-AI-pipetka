package_checklists:
  profiles:
    passport: [intake, passport]
    signage: [intake, signage]
    facade: [intake, special, facade]
  source: Примеры чек-листов.xlsx
  sha256: 7bb2269d6b0eb10592972cfe9040b33bfdf2d6b15572432d8c2d8c005d45dc5f
  sheet: Лист1
  sections:
    intake:
    - id: intake-1
      title: Запрос подан неуполномоченным лицом (ЭЦП не принадлежит заявителю)
      requirement: '• ЭЦП, которой подписан запрос, принадлежит именно заявителю (или его уполномоченному представителю).

        • Для представителя — наличие доверенности, оформленной в установленном порядке.

        • Для юридических лиц — сертификат ключа проверки ЭЦП выдан аккредитованным удостоверяющим центром.'
      ref: п. 2.8.1.4, 2.8.1.6, 2.5.4 Регламента
      source_range: C24:F24
      options:
      - Нарушение есть
      - Нарушения нет
    - id: intake-2
      title: Предоставлен неполный комплект документов (нет доверенности представителя)
      requirement: '• Наличие документа, подтверждающего полномочия представителя (для физических лиц — нотариально
        удостоверенная доверенность).

        • Наличие документа, подтверждающего полномочия лица действовать от имени юридического лица (если обращается
        не руководитель).

        • Полнота комплекта по п. 2.5.1.1 Регламента.'
      ref: п. 2.8.1.7, 2.5.1.1.2–2.5.1.1.3 Регламента
      source_range: C25:F25
      options:
      - Нарушение есть
      - Нарушения нет
    - id: intake-3
      title: Некорректное заполнение обязательных полей в интерактивной форме заявления
      requirement: '• Все обязательные поля интерактивной формы на Портале заполнены.

        • Сведения не содержат ошибок, опечаток, противоречий.

        • Формат введённых данных соответствует требованиям.'
      ref: п. 2.8.1.9 Регламента
      source_range: C26:F26
      options:
      - Нарушение есть
      - Нарушения нет
    - id: intake-4
      title: Представленные документы утратили срок действия
      requirement: '• Срок действия документа указан в самом документе или определён законодательством.

        • Документы не являются просроченными (например, выписки, согласования, доверенности).'
      ref: п. 2.8.1.2 Регламента
      source_range: C27:F27
      options:
      - Нарушение есть
      - Нарушения нет
    - id: intake-5
      title: Электронные копии документов не поддаются прочтению и/или не соответствуют требованиям к форматам их
        предоставления
      requirement: '• Формат PDF, разрешение ≥ 300 dpi, цветной режим.

        • Отсутствие деформации, чёрных полей > 1 мм, полос, пятен, размытости.

        • Количество образов = количеству листов.

        • Порядок страниц соблюдён.

        • Архивация ZIP (при необходимости).'
      ref: ''
      source_range: C28:F28
      options: []
    - id: intake-6
      title: Для МКАД кворум жильцов
      requirement: ''
      ref: ''
      source_range: C29:F29
      options: []
    special:
    - id: special-1
      title: Наличие в реестре объектов культурного наследия
      requirement: '• Если объект является ОКН или выявленным ОКН — действие Положения не распространяется (п. 1.3.1).

        • Если объект расположен в границах территорий ОКН, на связанных участках, в зонах охраны — требуется согласование
        ДКН (п. 2.5.1.3.1).

        • При наличии в реестре ОКН — требования Постановления № 94-ПП не предъявляются (услуга не оказывается по
        данному Положению).'
      ref: п. 1.3.1 Постановления № 94-ПП; п. 2.5.1.3.1, 2.10.1.6–2.10.1.7 Регламента
      source_range: C33:F33
      options:
      - В реестре ОКН
      - Не в реестре
    - id: special-2
      title: БТИ — несоответствие планам технической инвентаризации
      requirement: '• Сверка представленных планов помещений с данными БТИ (поэтажный план, выписка из техпаспорта
        ф. 1а).

        • Выявление расхождений в конфигурации помещений, площади, границах.

        • При несоответствии — противоречивые/недостоверные сведения (п. 2.10.1.3) → отказ.

        • При отсутствии документов БТИ — отказ (п. 2.10.1.4).'
      ref: ''
      source_range: C34:F34
      options: []
    passport:
    - id: passport-1
      title: Определён ли тип проекта
      requirement: Индивидуальный проект (для конкретного объекта) или типовой проект (для ДОУ, школ — по Альбому
        типовых решений МКА)
      ref: Слайд 4
      source_range: C47:F47
      options:
      - Индивидуальный
      - Типовой
    - id: passport-2
      title: Разработан ли проект архбюро или собственником
      requirement: Проект разрабатывается собственником самостоятельно или с привлечением архбюро
      ref: Слайд 4
      source_range: C48:F48
      options:
      - Да
      - Нет
    - id: passport-3
      title: Соответствует ли проект Постановлению № 114-ПП
      requirement: Проект колористического решения должен соответствовать требованиям Постановления Правительства
        Москвы от 28.03.2012 № 114-ПП
      ref: Слайд 4
      source_range: C49:F49
      options:
      - Да
      - Нет
    - id: passport-4
      title: Для типового проекта — использование Альбома типовых решений
      requirement: Типовой проект разрабатывается в соответствии с Альбомом типовых колористических решений, утверждённым
        МКА (актуализируется 1 раз в 3 года, размещён на сайте МКА)
      ref: Слайд 4
      source_range: C50:F50
      options:
      - Применимо
      - Не применимо
    - id: passport-5
      title: Наличие пояснительной записки
      requirement: С описанием существующего состояния объекта и проектного колористического решения фасадов
      ref: Слайд 5
      source_range: C51:F51
      options:
      - Есть
      - Нет
    - id: passport-6
      title: Наличие графических материалов
      requirement: Ортогональные чертежи фасадов в масштабе М 1:500, 1:200, 1:100, 1:50 (в зависимости от габаритов),
        с адресом объекта и автором проекта
      ref: Слайд 5
      source_range: C52:F52
      options:
      - Есть
      - Нет
    - id: passport-7
      title: Указаны отделочные материалы
      requirement: Сведения о материалах, марках цветов по палитрам NCS и RAL для всех элементов фасада
      ref: Слайд 5
      source_range: C53:F53
      options:
      - Есть
      - Нет
    - id: passport-8
      title: Чертежи фасадов без теней и лишних линий
      requirement: Все фасады в ортогональной проекции без падающих/собственных теней, высотных отметок, осевых
        и размерных линий
      ref: Слайд 5
      source_range: C54:F54
      options:
      - Соответствует
      - Не соответствует
    - id: passport-9
      title: Для объектов культурного наследия — согласование с ДКН
      requirement: Требуется согласование с Департаментом культурного наследия города Москвы (межведомственное)
      ref: Слайд 2
      source_range: C55:F55
      options:
      - Применимо
      - Не применимо
    - id: passport-10
      title: Подача заявления через mos.ru
      requirement: Заявление подаётся застройщиком на mos.ru, проверка документов — МКА
      ref: Слайд 6
      source_range: C56:F56
      options:
      - Да
      - Нет
    - id: passport-11
      title: Проверка необходимости приостановки и запроса в ГИН
      requirement: При необходимости — приостановка до 60 рабочих дней, запрос в ГИН
      ref: Слайд 6
      source_range: C57:F57
      options:
      - Применимо
      - Не применимо
    - id: passport-12
      title: Срок оказания услуги
      requirement: Регламентный срок — 17 рабочих дней; фактический средний в 2025 — 14 рабочих дней; доля отказов
        — 36%
      ref: Слайд 2
      source_range: C58:F58
      options:
      - Укладывается
      - Не укладывается
    - id: passport-13
      title: Срок действия ПКР
      requirement: Утверждённый ПКР действует бессрочно
      ref: Слайд 2
      source_range: C59:F59
      options:
      - Да
      - Нет
    - id: passport-14
      title: Точное соответствие работ утверждённому ПКР
      requirement: Работы по окраске и замене материалов должны точно соответствовать ПКР; любое отклонение — предписание
        вернуть прежний цвет
      ref: Слайд 2
      source_range: C60:F60
      options: []
    signage:
    - id: signage-1
      title: Определить, требуется ли согласование
      requirement: 'Требуется в случаях: отдельно стоящая конструкция; вывеска на крыше; на торговых/развлекательных
        центрах, кинотеатрах, театрах, цирках, спортивных центрах, выставочных залах, музеях; крышные конструкции
        на улицах вне утверждённых концепций; АЗС (в т.ч. ценовые табло); внесение изменений в утверждённую концепцию;
        временные отдельно стоящие конструкции на период строительства жилья'
      ref: Слайд 8
      source_range: C65:F65
      options:
      - Требуется
      - Не требуется
    - id: signage-2
      title: Разработан ли дизайн-проект по Постановлению № 902-ПП
      requirement: Дизайн-проект разрабатывается в соответствии с Правилами, утверждёнными Постановлением Правительства
        Москвы от 25.12.2013 № 902-ПП
      ref: Слайд 7
      source_range: C66:F66
      options:
      - Да
      - Нет
    - id: signage-3
      title: Получены ли документы технической инвентаризации
      requirement: 'Обязательная услуга при согласовании: поэтажный план, выписка из технического паспорта здания
        (через mos.ru)'
      ref: Слайд 7
      source_range: C67:F67
      options:
      - Получены
      - Не получены
    - id: signage-4
      title: Наличие фотофиксации с датой
      requirement: Фотографии существующего положения объекта с фиксацией даты
      ref: Слайд 9
      source_range: C68:F68
      options:
      - Есть
      - Нет
    - id: signage-5
      title: Наличие фотомонтажа
      requirement: Графическая врисовка вывески в место предполагаемого размещения в существующую ситуацию
      ref: Слайд 9
      source_range: C69:F69
      options:
      - Есть
      - Нет
    - id: signage-6
      title: Наличие ортогональных чертежей фасадов
      requirement: В масштабе М 1:50, 1:100, 1:200, 1:500, с отражением утверждённой Архитектурно-художественной
        концепции (если применимо)
      ref: Слайд 9
      source_range: C70:F70
      options:
      - Есть
      - Нет
    - id: signage-7
      title: Наличие экспликации вывесок
      requirement: Перечень предполагаемых к размещению вывесок
      ref: Слайд 9
      source_range: C71:F71
      options:
      - Есть
      - Нет
    - id: signage-8
      title: Содержание пояснительной записки
      requirement: Адрес объекта, тип вывески, способ освещения, материалы конструкции, колористические и технические
        решения, заглубление (для отдельно стоящих), субъект розничной реализации нефтепродуктов (для АЗС), информация
        об уникальных конструкциях (фото, архивные данные)
      ref: Слайд 9
      source_range: C72:F72
      options:
      - Полное
      - Неполное
    - id: signage-9
      title: Согласование с ФСО РФ (при необходимости)
      requirement: Для вывесок на крышах зданий по трассам проезда и размещения объектов госохраны Москвы — согласование
        с Федеральной службой охраны РФ (межвед.)
      ref: Слайд 7
      source_range: C73:F73
      options:
      - Применимо
      - Не применимо
    - id: signage-10
      title: Согласование с Дептранс (при необходимости)
      requirement: Для ценовых табло АЗС — согласование с Департаментом транспорта
      ref: Слайд 10
      source_range: C74:F74
      options:
      - Применимо
      - Не применимо
    - id: signage-11
      title: Подача заявления через mos.ru
      requirement: Заявление подаётся собственником на mos.ru, проверка документов — МКА
      ref: Слайд 10
      source_range: C75:F75
      options:
      - Да
      - Нет
    - id: signage-12
      title: Возможная приостановка
      requirement: До 60 рабочих дней при запросе в ФСО РФ
      ref: Слайд 10
      source_range: C76:F76
      options:
      - Применимо
      - Не применимо
    - id: signage-13
      title: Срок оказания услуги
      requirement: Регламентный — 13 рабочих дней; фактический средний в 2025 — 12 рабочих дней; доля отказов —
        73%
      ref: Слайд 7
      source_range: C77:F77
      options:
      - Укладывается
      - Не укладывается
    - id: signage-14
      title: Соответствие размещения согласованному проекту/концепции
      requirement: Вывеска размещается строго в соответствии с согласованным дизайн-проектом или утверждённой Архитектурно-художественной
        концепцией; несоответствие — предписание и штрафы
      ref: Слайд 7
      source_range: C78:F78
      options: []
    facade:
    - id: facade-1
      title: Определить вид работ
      requirement: Создание/ликвидация/изменение формы оконных и дверных проёмов; создание/изменение входных групп;
        создание/изменение тамбуров; устройство навесов и козырьков; создание витрин
      ref: Слайд 11; п. 1.4 Постановления № 94-ПП
      source_range: C82:F82
      options:
      - Определён
    - id: facade-2
      title: Проверить, не подпадает ли объект под исключения
      requirement: 'Не распространяется на: объекты культурного наследия; объекты, возведённые с нарушением требований;
        работы, требующие разрешения на строительство; замену инженерных систем и оборудования'
      ref: п. 1.3 Постановления № 94-ПП
      source_range: C83:F83
      options:
      - Подпадает
      - Не подпадает
    - id: facade-3
      title: Проверить расположение объекта
      requirement: Объект в пределах Садового кольца или на улицах/магистралях из п. 1.2.2 Постановления № 94-ПП
      ref: п. 1.2 Постановления № 94-ПП
      source_range: C84:F84
      options:
      - Входит
      - Не входит
    - id: facade-4
      title: Разработан ли проект проектной организацией — членом СРО
      requirement: Проект оформляется проектной организацией, являющейся членом саморегулируемой организации
      ref: п. 1.5 Постановления № 94-ПП
      source_range: C85:F85
      options:
      - Да
      - Нет
    - id: facade-5
      title: Наличие технического заключения
      requirement: Может содержаться в составе проекта или быть отдельным документом; оформляется проектной организацией
        — членом СРО
      ref: п. 1.5 Постановления № 94-ПП
      source_range: C86:F86
      options:
      - Есть
      - Нет
    - id: facade-6
      title: 'Состав проекта: пояснительная записка'
      requirement: Описание существующего состояния объекта и прилегающих территорий, колористического решения;
        перечень производимых работ
      ref: п. 3.4.1 Постановления № 94-ПП
      source_range: C87:F87
      options:
      - Есть
      - Нет
    - id: facade-7
      title: 'Состав проекта: чертежи, фотофиксация, фотомонтаж'
      requirement: Чертежи элементов фасадов, фотофиксация (не более чем за 2 месяца до обращения), фотомонтаж —
        в цвете, на художественно-графическом уровне
      ref: п. 3.4.2 Постановления № 94-ПП
      source_range: C88:F88
      options:
      - Есть
      - Нет
    - id: facade-8
      title: 'Состав проекта: планы помещений'
      requirement: План до работ, план с монтажно-демонтажными работами (разными цветами), план после работ — с
        экспликацией в масштабе М 1:50 (1:100, 1:200)
      ref: п. 3.4.3–3.4.5 Постановления № 94-ПП
      source_range: C89:F89
      options:
      - Есть
      - Нет
    - id: facade-9
      title: 'Состав проекта: схема размещения и генплан'
      requirement: Схема размещения объекта в городской застройке на картографических материалах; схема генплана
        прилегающего участка (при изменении благоустройства)
      ref: п. 3.4.6–3.4.7 Постановления № 94-ПП
      source_range: C90:F90
      options:
      - Есть
      - Нет
    - id: facade-10
      title: 'Состав проекта: раздел об обеспечении сохранности ОКН'
      requirement: При расположении в границах территорий ОКН или на связанных земельных участках — раздел с оценкой
        воздействия
      ref: п. 3.4.8 Постановления № 94-ПП
      source_range: C91:F91
      options:
      - Применимо
      - Не применимо
    - id: facade-11
      title: 'Состав проекта: ведомость материалов'
      requirement: Ведомость используемых материалов, видов отделки, марок цветов по NCS и RAL
      ref: п. 3.4.9 Постановления № 94-ПП
      source_range: C92:F92
      options:
      - Есть
      - Нет
    - id: facade-12
      title: Проверить запреты (п. 2.1)
      requirement: 'Запрещено: входы на 2-й и выше этажи с улицы (кроме эвакуационных); входные группы, нарушающие
        ширину тротуара; перекрытие архитектурных элементов; окраска поверхностей из камня/плитки/керамического
        кирпича; облицовка откосов плиткой; замена остекления стеклоблоками; глухие дверные полотна на входах с
        витринами; распашные ставни; осветительное оборудование вне входных групп (кроме проекта архитектурно-художественного
        освещения); наружные тамбуры (кроме п. 2.2.3); вход в подвал со стороны фасада на красную линию'
      ref: п. 2.1 Постановления № 94-ПП
      source_range: C93:F93
      options:
      - Нарушений нет
      - Есть нарушения
    - id: facade-13
      title: Проверить требования к окнам и дверям (п. 2.2.1)
      requirement: Сохранение композиционного ритма; сохранение целостности фасада; соответствие цвета, рисунка,
        толщины переплётов, шага импостов; соответствие окраски откосов; идентичность материала при ликвидации проёмов;
        размещение блоков в одной плоскости с существующими
      ref: п. 2.2.1 Постановления № 94-ПП
      source_range: C94:F94
      options:
      - Соответствует
      - Не соответствует
    - id: facade-14
      title: Проверить требования к входным группам (п. 2.2.2)
      requirement: Без фундамента и организации помещения; высота тамбуров не выше линии перекрытия 1–2 этажей;
        вынос навеса не более 0,3 м; соответствие архитектурному решению фасада; только одна входная группа на помещение
        (если иное не предусмотрено пожарной безопасностью)
      ref: п. 2.2.2 Постановления № 94-ПП
      source_range: C95:F95
      options:
      - Соответствует
      - Не соответствует
    - id: facade-15
      title: Проверить требования к тамбурам (п. 2.2.3)
      requirement: Без фундамента (без капитальных пристроек); площадь тамбура ≤ 15 кв. м (для социальных объектов
        — ≤ 40 кв. м); при изменении — не больше существующей площади (кроме случаев доступности МГН); стилистика,
        материалы и цвет — соответствие фасаду
      ref: п. 2.2.3 Постановления № 94-ПП
      source_range: C96:F96
      options:
      - Соответствует
      - Не соответствует
    - id: facade-16
      title: Проверить требования к навесам и козырькам (п. 2.2.4)
      requirement: Соответствие внешнему архитектурному решению; запрещено крепление к архитектурным элементам и
        декору; запрещено перекрытие оконных/дверных проёмов смежных помещений; запрещено закрытие архитектурных
        элементов и декора
      ref: п. 2.2.4 Постановления № 94-ПП
      source_range: C97:F97
      options:
      - Соответствует
      - Не соответствует
    - id: facade-17
      title: Проверить требования к витринам (п. 2.2.5)
      requirement: 'В пределах габаритов существующих элементов с выносом ≤ 1 м, точечное опирание на землю, заглубление
        ≤ 0,3 м; соответствие облику фасада; при наличии существующих витрин — идентичный вынос; запрещено: закрытие
        архитектурных элементов/декора, конструкции за пределами габаритов помещений, конструкции выше линии перекрытия
        1–2 этажей (кроме изначального проекта), непрозрачное остекление'
      ref: п. 2.2.5 Постановления № 94-ПП
      source_range: C98:F98
      options:
      - Соответствует
      - Не соответствует
    - id: facade-18
      title: Проверить требования к электронной форме документов (п. 3.9)
      requirement: Формат PDF; сохранение из векторных программ; печать полной бумажной версии без доп. действий;
        цветной режим, разрешение ≥ 300 dpi; отсутствие деформации; поворот до горизонтального уровня, очистка от
        мусора, выравнивание, обрезка краёв; количество образов = количеству листов; отсутствие чёрных полей > 1
        мм, полос, пятен, размытости; порядок страниц соблюдён
      ref: п. 3.9 Постановления № 94-ПП
      source_range: C99:F99
      options:
      - Соответствует
      - Не соответствует
    - id: facade-19
      title: Подача заявления через mos.ru
      requirement: Заявление подаётся застройщиком на mos.ru; регистрация и проверка документов — МКА
      ref: Слайд 11
      source_range: C100:F100
      options:
      - Да
      - Нет
    - id: facade-20
      title: Межведомственное взаимодействие
      requirement: ФНС, МосгорБТИ, ГИН, ДКН
      ref: Слайд 11
      source_range: C101:F101
      options:
      - Проведено
      - Не проведено
    - id: facade-21
      title: Возможная приостановка
      requirement: До 60 рабочих дней с запросом в ГИН (при необходимости)
      ref: Слайд 11
      source_range: C102:F102
      options:
      - Применимо
      - Не применимо
    - id: facade-22
      title: Срок оказания услуги
      requirement: Регламентный — 20 рабочих дней; фактический средний в 2025 — 19 рабочих дней; доля отказов —
        60%
      ref: Слайд 11
      source_range: C103:F103
      options:
      - Укладывается
      - Не укладывается
    - id: facade-23
      title: Срок действия Решения и продление
      requirement: Решение действительно 1 год; продление однократно на срок не более 1 года по запросу не позднее
        последнего дня действия
      ref: п. 1.6 Постановления № 94-ПП
      source_range: C104:F104
      options:
      - Учтено
      - Не учтено
    - id: facade-24
      title: Оформление Заключения о выполненных работах
      requirement: Запрос подаётся не позднее 3 месяцев со дня окончания срока действия Решения
      ref: п. 1.7 Постановления № 94-ПП
      source_range: C105:F105
      options:
      - Учтено
      - Не учтено
    - id: facade-25
      title: Оформление Заключения в отношении ранее выполненных работ
      requirement: 'Допускается при обращении: до 01.10.2023 (в пределах Садового кольца); до 01.01.2026 (на улицах
        из п. 1.2.2); на основании технического заключения; Решение не оформляется'
      ref: п. 1.8–1.9 Постановления № 94-ПП
      source_range: C106:F106
      options:
      - Применимо
      - Не применимо
    - id: facade-26
      title: Натурное обследование
      requirement: Проводится уполномоченной организацией в срок не позднее 6 рабочих дней со дня регистрации запроса;
        оформляется описание (анализ) объекта
      ref: п. 1.10 Постановления № 94-ПП
      source_range: C107:F107
      options:
      - Проведено
      - Не проведено
    - id: facade-27
      title: Основания для отказа в оформлении Заключения
      requirement: Выявлены пристройки/надстройки, затрагивающие облик, без правоустанавливающих документов; объект/участок
        в перечнях по Постановлению № 819-ПП
      ref: п. 1.11 Постановления № 94-ПП
      source_range: C108:F108
      options:
      - Есть основания
