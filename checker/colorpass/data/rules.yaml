# Признаки вида документа ищутся в начале PDF, а не в его имени.
document_identification:
  title_pages: 3
  title_characters: 2500
  patterns:
    passport:
    - 'паспорт\s+(?:колористическ\w*\s+решени\w*|цветов\w*\s+решени\w*)'
    signage:
    - 'дизайн\s*[-–—]?\s*проект\s+(?:размещени\w*\s+)?(?:информационн\w*\s+конструкц\w*|вывес\w*)'
    facade:
    - 'проект\w*\s+(?:изменени\w*\s+)?внешн\w*\s+облик\w*'
    - 'проект\w*\s+(?:изменени\w*|реконструкци\w*|ремонт\w*)\s+фасад\w*'
