# Локальная разработка: код всех сервисов смонтирован в контейнеры.
#   docker compose up --build       → интерфейс http://localhost:5173, API http://localhost:8000/api/health
# Сервисы:
#   frontend         React (Vite): /api → backend, /files → checker, /chat → chat, /new → новый интерфейс
#   prototype        новый интерфейс (TanStack Router, Vite) на /new — http://localhost:5174/new/
#   applications-api  серверная часть нового интерфейса: better-auth, заявки (SQLite), ассистент через chat
#   backend          Django: API, PostgreSQL, журнал пакетов, решения инспектора; файлов не касается
#   checker          проверка PDF, OCR, листы, сравнение фото, Excel, хранение файлов (runs/); задачи — из очереди Redis
#   chat             языковая модель (GigaChat API): чат по отчёту, заключение, описание фото
#   redis            очередь задач backend → checker и готовые результаты
#   db               PostgreSQL
# Прод — compose.prod.yml (сборка образов: gunicorn, Caddy со статикой и HTTPS).
name: colorpass-dev

services:
  backend:
    build: ./backend
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]   # автоперезагрузка при изменении кода
    environment:
      DATABASE_URL: postgresql://colorpass:${POSTGRES_PASSWORD:-colorpass}@db:5432/colorpass
      REDIS_URL: redis://redis:6379/0
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "*"
    volumes:
      - ./backend:/app/backend    # код — с диска
    ports: ["127.0.0.1:${COLORPASS_API_PORT:-8000}:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s

  checker:
    build: ./checker
    environment:
      REDIS_URL: redis://redis:6379/0
      COLORPASS_WORKERS: "2"        # пакетов одновременно
      COLORPASS_RPC_WORKERS: "4"    # быстрые операции: развёртки, углы, сравнение фото, Excel
      COLORPASS_MAX_UPLOAD_MB: "100"
    volumes:
      - ./checker:/app/checker  # код — с диска (после правок: docker compose restart checker)
      - ./runs:/app/runs            # файлы документов и пакетов
      - ./dataset:/app/dataset      # образцы с разметкой
    ports: ["127.0.0.1:${COLORPASS_FILES_PORT:-8001}:8001"]
    depends_on:
      redis: { condition: service_healthy }

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: ["sh", "-c", "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"]
    environment:
      VITE_API_TARGET: http://backend:8000      # vite проксирует /api на backend
      VITE_FILES_TARGET: http://checker:8001  # /files — на checker (загрузка и файлы документов)
      VITE_CHAT_TARGET: http://chat:3000        # /chat — на сервис моделей
      VITE_PROTOTYPE_TARGET: http://prototype:3000   # /new — новый интерфейс (переключатель в шапке)
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules   # зависимости — в томе, не на диске Mac
    ports: ["${COLORPASS_PORT:-5173}:5173"]
    depends_on:
      backend: { condition: service_healthy }

  chat:                         # языковая модель GigaChat (TanStack AI): чат, заключение, описание фото; данные — из backend
    build: ./chat
    command: ["node", "--watch", "src/server.js"]   # перезапуск при изменении кода
    environment:
      BACKEND_URL: http://backend:8000
      FILES_URL: http://checker:8001/files
      # языковая модель — GigaChat API; без ключа ИИ-функции недоступны, проверка по правилам работает
      GIGACHAT_AUTH_KEY: ${GIGACHAT_AUTH_KEY:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat-2-Max}
      LLM_TIMEOUT: "300"
    volumes:
      - ./chat/src:/app/src       # код — с диска; зависимости — в образе (поменяли package.json — up --build)
    ports: ["127.0.0.1:${COLORPASS_CHAT_PORT:-3000}:3000"]
    depends_on:
      backend: { condition: service_healthy }

  prototype:                    # новый интерфейс: Vite dev server, base /new/; /new/api → applications-api
    image: node:22-bookworm-slim
    working_dir: /app
    command: ["sh", "-c", "corepack enable && pnpm install && pnpm dev --host 0.0.0.0"]
    environment:
      VITE_APPLICATIONS_API: http://applications-api:3100
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    volumes:
      - ./prototype:/app
      - prototype-node-modules:/app/node_modules   # зависимости — в томе (на Mac свои, под macOS)
    ports: ["${COLORPASS_PROTOTYPE_PORT:-5174}:3000"]
    depends_on:
      - applications-api

  applications-api:                # серверная часть нового интерфейса
    build: ./applications-api
    command: ["npx", "tsx", "watch", "src/index.ts"]
    environment:
      NODE_ENV: development
      BETTER_AUTH_URL: http://localhost:${COLORPASS_PROTOTYPE_PORT:-5174}
      AUTH_ALLOWED_HOSTS: localhost:${COLORPASS_PROTOTYPE_PORT:-5174},localhost:${COLORPASS_PORT:-5173}
      BETTER_AUTH_SECRET: ${PROTOTYPE_AUTH_SECRET:-dev-prototype-secret-change-me-0123456789}
      APPROVER_EMAILS: ${APPROVER_EMAILS:-}
      NORMCONTROL_EMAILS: ${NORMCONTROL_EMAILS:-}
      CHAT_URL: http://chat:3000
      BACKEND_URL: http://backend:8000
      FILES_URL: http://checker:8001/files
    volumes:
      - ./applications-api/src:/app/src    # код — с диска
      - applications-data:/data            # SQLite и загруженные PDF
    ports: ["127.0.0.1:${COLORPASS_APPLICATIONS_API_PORT:-3100}:3100"]
    depends_on:
      - chat

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]   # очередь переживает перезапуск
    volumes: ["redis-data:/data"]
    ports: ["127.0.0.1:${COLORPASS_REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: colorpass
      POSTGRES_USER: colorpass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-colorpass}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:${COLORPASS_DB_PORT:-5432}:5432"]   # для psql/DBeaver с этого компьютера
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colorpass -d colorpass"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redis-data:
  frontend-node-modules:
  prototype-node-modules:
  applications-data:
