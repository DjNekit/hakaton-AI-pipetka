# Локальная разработка: код backend и frontend смонтирован в контейнеры, изменения подхватываются на лету.
#   docker compose up --build       → интерфейс http://localhost:5173, API http://localhost:8000/api/health
# Прод — compose.prod.yml (сборка образов: gunicorn, Caddy со статикой и HTTPS).
name: colorpass-dev

services:
  backend:
    build: ./backend
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]   # автоперезагрузка при изменении кода
    environment:
      GIGACHAT_AUTH_KEY: ${GIGACHAT_AUTH_KEY:-}      # GigaChat API — единственная модель; без ключа — проверка по правилам
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat-2-Max}
      GIGACHAT_VERIFY_SSL: ${GIGACHAT_VERIFY_SSL:-1}
      DATABASE_URL: postgresql://colorpass:${POSTGRES_PASSWORD:-colorpass}@db:5432/colorpass
      LLM_TIMEOUT: "300"
      COLORPASS_WORKERS: "2"
      COLORPASS_MAX_UPLOAD_MB: "100"
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "*"
    volumes:
      - ./backend:/app/backend    # код — с диска
      - ./runs:/app/runs          # отчёты проверок
      - ./dataset:/app/dataset    # размеченные паспорта и дизайн-проекты
    ports: ["127.0.0.1:${COLORPASS_API_PORT:-8000}:8000"]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/rules', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"]
    environment:
      VITE_API_TARGET: http://backend:8000   # vite проксирует /api на backend
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules   # зависимости — в томе, не на диске Mac
    ports: ["${COLORPASS_PORT:-5173}:5173"]
    depends_on:
      backend: { condition: service_healthy }

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: colorpass
      POSTGRES_USER: colorpass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-colorpass}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:${COLORPASS_DB_PORT:-5432}:5432"]   # для psql/DBeaver с этого компьютера
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colorpass -d colorpass"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  frontend-node-modules:
