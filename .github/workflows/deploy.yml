# Тесты и деплой на сервер при пуше в main.
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   SSH_HOST            адрес сервера (168.113.211.193)
#   SSH_USER            пользователь SSH (root или пользователь с правами на docker)
#   SSH_PRIVATE_KEY     приватный ключ деплоя; его публичная часть — в ~/.ssh/authorized_keys на сервере
#   GIGACHAT_AUTH_KEY   ключ авторизации GigaChat API
#   POSTGRES_PASSWORD   пароль базы на сервере
#   DJANGO_SECRET_KEY   секрет Django (любая длинная случайная строка)
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DOMAIN: ai-pipetka.fun
  APP_DIR: /opt/colorpass

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Тесты backend
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Сборка frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SSH-ключ
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -T 15 -H "$SSH_HOST" >> ~/.ssh/known_hosts
          printf 'Host prod\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy\n  ServerAliveInterval 30\n' \
            "$SSH_HOST" "${{ secrets.SSH_USER }}" > ~/.ssh/config

      - name: Docker на сервере
        run: |
          ssh prod 'command -v rsync >/dev/null || (apt-get update -qq && apt-get install -y -qq rsync)'
          ssh prod 'command -v docker >/dev/null && docker compose version >/dev/null 2>&1 || (curl -fsSL https://get.docker.com | sh)'

      - name: Код на сервер
        run: |
          ssh prod "mkdir -p $APP_DIR/runs"
          rsync -az --delete \
            --exclude '.git/' --exclude '.github/' --exclude '.env' --exclude 'runs/' \
            --exclude 'node_modules/' --exclude '__pycache__/' --exclude '.DS_Store' \
            ./ prod:$APP_DIR/

      - name: Секреты (.env на сервере)
        env:
          GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        run: |
          {
            echo "DOMAIN=$DOMAIN"
            echo "GIGACHAT_AUTH_KEY=$GIGACHAT_AUTH_KEY"
            echo "GIGACHAT_SCOPE=GIGACHAT_API_PERS"
            echo "GIGACHAT_MODEL=GigaChat-2-Max"
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "DJANGO_SECRET_KEY=$DJANGO_SECRET_KEY"
          } | ssh prod "umask 077 && cat > $APP_DIR/.env"

      - name: Сборка и запуск
        run: |
          ssh prod "cd $APP_DIR && docker compose -f compose.prod.yml up -d --build --remove-orphans && docker image prune -f"

      - name: Проверка https://${{ env.DOMAIN }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://$DOMAIN/api/rules" -o /dev/null; then
              echo "Сервис отвечает: https://$DOMAIN"
              curl -fsS "https://$DOMAIN/api/health" | head -c 600; echo
              exit 0
            fi
            echo "Ждём сервис ($i/30)…"; sleep 10
          done
          ssh prod "cd $APP_DIR && docker compose -f compose.prod.yml ps && docker compose -f compose.prod.yml logs --tail 80"
          exit 1
