# Прод: образы собираются на сервере, наружу смотрит только Caddy (80/443, сертификат Let's Encrypt).
#   docker compose -f compose.prod.yml up -d --build
# Разворачивается автоматически при пуше в main (.github/workflows/deploy.yml); .env на сервере пишет CI.
# Caddy: /api → backend, /files → checker, /chat → chat, /new → новый интерфейс (prototype + applications-api),
# остальное — собранный React (прежний интерфейс).
name: colorpass

services:
  web:
    build: ./frontend               # Caddy: собранный React, HTTPS (Let's Encrypt), прокси на сервисы
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-ai-pipetka.fun}
    volumes:
      - caddy-data:/data          # сертификаты — переживают перезапуск и пересборку
      - caddy-config:/config
    depends_on:
      backend: { condition: service_healthy }
      checker: { condition: service_started }
      chat: { condition: service_started }
      prototype: { condition: service_started }
      applications-api: { condition: service_started }

  prototype:                        # новый интерфейс: собранная статика (SPA) на /new
    build: ./prototype
    restart: always

  applications-api:                    # серверная часть нового интерфейса: better-auth, заявки (SQLite), ассистент через chat
    build: ./applications-api
    restart: always
    environment:
      BETTER_AUTH_URL: https://${DOMAIN:-ai-pipetka.fun}
      BETTER_AUTH_SECRET: ${PROTOTYPE_AUTH_SECRET:?задайте PROTOTYPE_AUTH_SECRET}
      APPROVER_EMAILS: ${APPROVER_EMAILS:-}
      NORMCONTROL_EMAILS: ${NORMCONTROL_EMAILS:-}
      CHAT_URL: http://chat:3000
      BACKEND_URL: http://backend:8000
      FILES_URL: http://checker:8001/files
    volumes: ["applications-data:/data"]   # SQLite и загруженные PDF
    depends_on:
      chat: { condition: service_started }

  backend:
    build: ./backend                # gunicorn: API, база, журнал, решения
    restart: always
    environment:
      DATABASE_URL: postgresql://colorpass:${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD}@db:5432/colorpass
      REDIS_URL: redis://redis:6379/0
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?задайте DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "*"     # снаружи только Caddy → backend
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s

  checker:
    build: ./checker              # проверка PDF, OCR, листы, сравнение фото, Excel, файлы
    restart: always
    environment:
      REDIS_URL: redis://redis:6379/0
      COLORPASS_WORKERS: "2"
      COLORPASS_RPC_WORKERS: "4"
      COLORPASS_MAX_UPLOAD_MB: "100"
    volumes:
      - ./runs:/app/runs
      - ./dataset:/app/dataset
    depends_on:
      redis: { condition: service_healthy }

  chat:                             # языковая модель GigaChat (TanStack AI): чат, заключение, описание фото
    build: ./chat
    restart: always
    environment:
      BACKEND_URL: http://backend:8000
      FILES_URL: http://checker:8001/files
      # языковая модель — GigaChat API; без ключа ИИ-функции недоступны, проверка по правилам работает
      GIGACHAT_AUTH_KEY: ${GIGACHAT_AUTH_KEY:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat-2-Max}
      LLM_TIMEOUT: "300"
    depends_on:
      backend: { condition: service_healthy }

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]   # наружу порт не открыт
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: colorpass
      POSTGRES_USER: colorpass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD}
    volumes: ["pgdata:/var/lib/postgresql/data"]   # наружу порт не открыт
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colorpass -d colorpass"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redis-data:
  applications-data:
  caddy-data:
  caddy-config:
