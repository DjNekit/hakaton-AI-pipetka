# Формализованные требования к паспорту колористического решения фасадов.
#
# Основание: ПП Москвы от 28.03.2012 № 114-ПП «О колористических решениях фасадов зданий,
# строений, сооружений в городе Москве» (ред. от 03.04.2025):
#   прил. 1 — Положение о формировании колористического решения (п. 3 — состав проекта),
#   прил. 2 — Административный регламент (п. 2.8.1 — основания отказа в приёме документов),
#   прил. 3 — форма Паспорта.
# Структура разделов I–V — по опубликованному паспорту Москомархитектуры (2019).
# ВНИМАНИЕ: номера пунктов сверены по выдержкам; перед защитой сверить с первоисточником
# (https://www.mos.ru/authority/documents/doc/9045220/).

version: 1

thresholds:
  archive_after_days: 30       # принятый или отклонённый документ уходит в архив через 30 дней
  delta_e_swatch_warn: 8       # ΔE00 образец ↔ марка RAL: предупреждение
  delta_e_swatch_error: 15     #                           ошибка
  delta_e_ncs_factor: 1.6      # для NCS (приближённый перевод) пороги умножаются
  delta_e_pair_warn: 20        # NCS ↔ RAL одного элемента
  delta_e_zone_error: 12       # зона на развёртке ↔ таблица
  delta_e_undeclared: 14       # кластер цвета на развёртке не похож ни на один заявленный
  undeclared_min_share: 0.006  # минимальная доля пикселей кластера
  glazing_max_chroma: 10       # «серый» = C*ab ≤ 10
  scan_dpi_error: 150
  scan_dpi_warn: 300
  min_facades: 4
  scan_color_factor: 1.5       # сканы: пороги ΔE для образцов мягче; цветовые замечания по сканам — предупреждения
  # вывески — 902-ПП, прил. 1 (размеры, мм) и прил. 2 (дизайн-проект)
  sign_wall_max_height: 500           # настенная вывеска
  sign_wall_max_height_no_backing: 750  # объёмные символы без подложки (основной шрифт ≤ 500)
  sign_wall_max_length: 15000         # одна конструкция; и не более 70 % длины фасада помещений
  sign_console_max_height: 1000
  sign_console_max_width: 200
  sign_console_max_offset: 1000       # крайняя точка лицевой стороны от фасада
  sign_window_max_height: 400         # на внешней стороне витрины / буквы на стекле
  sign_photo_max_age_days: 62         # фотофиксация — не более двух месяцев до обращения
  # сравнение фото здания с развёрткой (photo.py)
  photo_zone_delta_e: 14       # ΔE00 (kL = 2) точка фото ↔ цвет зоны развёртки: выше — отличие
  photo_zone_mismatch_share: 0.5   # зона «не совпадает», если отличается больше этой доли её площади
  photo_undeclared_min_share: 0.02 # минимальная площадь области-отличия (доля развёртки)
  photo_mismatch_total_share: 0.08 # вердикт «не совпадает», если отличается больше этой доли сравниваемой площади
  photo_glass_min_l: 88        # светлые малонасыщенные заливки развёртки — остекление, не сравниваются

required_sections:
  title: "Титульный лист (номер, дата, адрес)"
  general: "Раздел I. Общие сведения об объекте"
  urban: "Раздел II. Градостроительная характеристика"
  arch: "Раздел III. Архитектурная характеристика, пояснительная записка"
  photo: "Раздел III, п. 3. Фотофиксация объекта"
  facade: "Раздел IV. Развёртки фасадов"
  finish_table: "Раздел V. Таблица отделки"

required_general_fields:
  - "Наименование объекта"
  - "Адрес объекта"
  - "Правообладатель"
  - "Год постройки"
  - "Этажность"
  - "Вид работ"
  - "Разработчик проекта"

allowed_scales: ["1:50", "1:100", "1:200", "1:500"]

forbidden_patterns:
  height_marks: '(?<![\w.])[±+−-]\s?\d{1,3}[.,]\d{3}(?!\d)'
  equipment: '(кондиционер|сплит-систем|вентиляционн\w* короб|наружн\w* блок)'
  advertising: '(реклам\w*|вывеск\w*|информационн\w* конструкц)'

categories:
  signage: "Дизайн-проект вывесок (902-ПП)"
  completeness: "Комплектность"
  general: "Общие сведения"
  graphics: "Оформление графической части"
  table: "Таблица отделки"
  text: "Пояснительная записка"
  drawing: "Развёртки ↔ таблица отделки"

